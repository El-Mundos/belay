{{define "content"}}
<h2 class="tabhead">Upgrade history</h2>
{{if not .Records}}<p class="muted">No successful upgrades yet.</p>{{end}}
{{if .Records}}
<table>
  <thead><tr><th>when</th><th>project</th><th>service</th><th>change</th><th>took</th></tr></thead>
  <tbody>
  {{range .Records}}
    <tr>
      <td class="muted">{{.Time.Format "Jan 2, 15:04"}}</td>
      <td>{{.Project}}</td>
      <td class="svc">{{.Service}}</td>
      <td class="mono"><span class="muted">{{.From}}</span> → <span class="ok">{{.To}}</span></td>
      <td class="muted">{{.Duration}}</td>
    </tr>
  {{end}}
  </tbody>
</table>
{{end}}
{{end}}

{{define "content"}}
<h2 class="tabhead">Update all — review</h2>
<div class="toolbar">
  <label class="cl-toggle"><input type="checkbox" onchange="belayToggleChangelogs(this.checked)"> show changelogs</label>
  <form method="post" action="/update-all" onsubmit="return belayConfirm('Update every service with a newer version? Each is health-checked and rolls back automatically if it fails.', this)">
    <button class="btn" type="submit" id="update-all-btn" disabled>Checking <span id="rev-progress">0/{{.Count}}</span>…</button>
  </form>
  <a class="btn ghost" href="/">Cancel</a>
</div>
{{if eq .Count 0}}<p class="muted">No services to check.</p>{{end}}
<p class="muted small" id="rev-hint">Checking every service for a newer version… the button unlocks when the scan finishes.</p>
<div id="review-list" data-total="{{.Count}}">
  {{range .Services}}
  <div class="review-item" data-done="0">
    <div class="rec-head">
      <span class="svc">{{.Service}}</span>
      {{if not .Local}}<span class="chip">{{.Host}}</span>{{end}}
      <span class="muted small">{{.Project}}</span>
      <span class="rev-status status time"
            hx-get="/review/check"
            hx-vals='{{if .Local}}{"p":"{{.PID}}","s":"{{.Service}}"}{{else}}{"host":"{{.Host}}","file":"{{.File}}","s":"{{.Service}}","image":"{{.Image}}"}{{end}}'
            hx-trigger="load" hx-swap="innerHTML"
            hx-on::after-request="belayReviewChecked(this)"><span class="muted">checking…</span></span>
    </div>
  </div>
  {{end}}
</div>
{{end}}
